<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#211329" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="消灭水果" />
  <meta name="description" content="点击成群水果，挑战无限关卡。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=13" />
  <title>消灭水果</title>
</head>
<body data-theme="orchard">
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p id="stageName" class="eyebrow">阳光果园 · 第1阶段</p>
        <h1>消灭水果</h1>
      </div>
      <div class="top-actions">
        <button id="collectionBtn" class="icon-button" aria-label="查看水果图鉴和纪录">📖</button>
        <button id="musicBtn" class="icon-button" aria-label="切换背景音乐">🎵</button>
        <button id="soundBtn" class="icon-button" aria-label="切换音效">🔊</button>
        <button id="settingsBtn" class="icon-button" aria-label="打开设置">⚙️</button>
      </div>
    </header>

    <section class="mission-card" aria-label="关卡信息">
      <div><span>关卡</span><strong id="levelText">第 1 关</strong></div>
      <div><span>累计总分</span><strong id="scoreText">0</strong></div>
      <div><span>过关目标</span><strong id="targetText">500</strong></div>
    </section>

    <div class="progress-track" aria-label="过关进度"><div id="progressBar"></div></div>

    <section class="live-stats" aria-label="实时得分信息">
      <span>本页 <b id="roundScoreText">0</b></span>
      <span>还差 <b id="gapText">500</b></span>
      <span>剩余 <b id="remainingText">80</b></span>
      <span>星星 <b id="starsText">0</b> ⭐</span>
    </section>
    <div class="progress-extra"><span id="streakText">🔥 连胜 0 · 最高 0</span><span>📖 图鉴与纪录</span></div>
    <p id="obstacleHint" class="obstacle-hint" hidden></p>

    <section id="missionStrip" class="mission-strip">
      <span>⭐ 本关挑战</span>
      <strong id="missionText">剩余不超过5个水果</strong>
      <em id="missionStatus">进行中</em>
    </section>

    <section id="bossPanel" class="boss-panel" hidden>
      <div class="boss-head"><span id="bossIcon">👾</span><strong id="bossName">水果巨兽</strong><b id="bossTarget">消除 🍎 攻击</b></div>
      <div class="boss-track"><div id="bossBar"></div></div>
      <small id="bossHp">生命 10 / 10</small>
    </section>

    <section class="board-wrap">
      <div id="comboLabel" class="combo-label" aria-live="polite"></div>
      <div id="board" class="board" role="grid" aria-label="水果消除棋盘"></div>
    </section>

    <section class="preview-bar" id="previewBar" aria-live="polite">
      <span id="previewText">先点选水果群，查看本次得分</span>
      <strong id="previewScore"></strong>
    </section>

    <section id="feverPanel" class="fever-panel" aria-label="狂热模式进度">
      <span id="feverLabel">🔥 狂热能量 0 / 5</span>
      <div class="fever-track"><div id="feverBar"></div></div>
    </section>

    <section class="controls">
      <button id="shuffleBtn" class="control-button"><span>🔀</span><b>水果重排</b><small id="shuffleCount">3 次</small></button>
      <button id="restartBtn" class="control-button"><span>↻</span><b>重玩本关</b><small>本页分数清零</small></button>
    </section>

    <p id="tip" class="tip">连消10个得😈炸弹，20个得👹超级炸弹</p>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card result-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalIcon" class="modal-icon">🍎</div>
      <div id="resultStars" class="result-stars" aria-label="本关星级">☆☆☆</div>
      <h2 id="modalTitle">任务完成</h2>
      <p id="modalText"></p>
      <div class="modal-stats">
        <div><span>消除得分</span><strong id="modalBaseScore">0</strong></div>
        <div><span>清屏与连胜奖励</span><strong id="modalBonus">0</strong></div>
        <div><span>附加挑战</span><strong id="modalMission">未完成</strong></div>
        <div class="total"><span>累计总分</span><strong id="modalScore">0</strong></div>
      </div>
      <button id="modalAction" class="primary-button">下一关</button>
    </div>
  </div>

  <div id="settingsModal" class="modal" hidden>
    <div class="modal-card settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-icon">⚙️</div>
      <h2 id="settingsTitle">游戏设置</h2>
      <label class="setting-row"><span>背景音乐</span><input id="musicToggle" type="checkbox" checked /></label>
      <label class="setting-row"><span>消除音效</span><input id="soundToggle" type="checkbox" checked /></label>
      <label class="setting-row"><span>震动反馈</span><input id="vibrateToggle" type="checkbox" checked /></label>
      <label class="setting-row"><span>二次确认消除</span><input id="confirmToggle" type="checkbox" checked /></label>
      <label class="volume-row"><span>音乐音量</span><input id="musicVolume" type="range" min="0" max="100" value="35" /></label>
      <p class="settings-note">关闭二次确认后，点击水果群会立即消除。</p>
      <button id="settingsClose" class="primary-button">保存设置</button>
    </div>
  </div>

  <div id="collectionModal" class="modal" hidden>
    <div class="modal-card collection-card" role="dialog" aria-modal="true" aria-labelledby="collectionTitle">
      <div class="modal-icon">📖</div>
      <h2 id="collectionTitle">水果图鉴与纪录</h2>
      <p id="recordsText"></p>
      <div id="collectionItems" class="collection-grid"></div>
      <button id="collectionClose" class="primary-button">返回游戏</button>
    </div>
  </div>

  <script src="game.js?v=13"></script>
</body>
</html>
